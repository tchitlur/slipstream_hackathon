name: fetch-housing-data
on:
  push:
    branches: [pnc-case-data]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests
      - run: python fetch4.py
      - name: commit data
        if: always()
        run: |
          git config user.name "data-fetch-bot"
          git config user.email "actions@github.com"
          git add -A data
          git commit -m "data: primary-source pull $(date -u +%Y-%m-%dT%H:%MZ)" || echo "nothing to commit"
          git push origin HEAD:pnc-case-data
